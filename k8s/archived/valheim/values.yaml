# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---
controllers:
  valheim:
    replicas: 0
    containers:
      app:
        image:
          repository: ghcr.io/mbround18/valheim
          tag: 3.8.2@sha256:f31f11f7e4670aa8baf14212292970d9aff7a16783dfe923fb819141e8f9a06b
        probes:
          liveness:
            enabled: false
          readiness:
            enabled: false
          startup:
            enabled: false
        env:
          TZ: "Europe/Amsterdam"
          PORT: 2456
          NAME: "Valheim LAN"
          WORLD: "kokparadise"
          AUTO_UPDATE: 1
          AUTO_UPDATE_SCHEDULE: 0 4 * * *
          AUTO_UPDATE_PAUSE_WITH_PLAYERS: 1
          TYPE: "BepInEx"
          PUBLIC: 0
          # PUID: 1010
          # PGID: 1010
        resources:
          requests:
            cpu: 10m
            memory: 10M
          limits:
            memory: 10Gi
        # securityContext:
        #   allowPrivilegeEscalation: false
        #   capabilities:
        #     drop:
        #       - ALL

service:
  app:
    controller: valheim
    type: LoadBalancer
    loadBalancerIP: 10.10.21.80
    ports:
      http:
        port: 80
      gameplay:
        enabled: true
        port: 2456
        protocol: UDP
      auth:
        enabled: true
        port: 2457
        protocol: UDP
      voip:
        enabled: true
        port: 2458
        protocol: UDP

persistence:
  data:
    existingClaim: local-valheim-pvc
    globalMounts:
      - path: /home/steam/.config/unity3d/IronGate/Valheim/
      - path: /home/steam/valheim/
