# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/refs/heads/main/charts/library/common/values.schema.json
---
controllers:
  home-assistant:
    pod:
      # most simple way of making mdns work
      # hostNetwork: true
      # dnsPolicy: ClusterFirstWithHostNet
      annotations:
        backup.velero.io/backup-volumes: config
        backup.velero.io/backup-volumes-excludes: tmpfs
    containers:
      app:
        image:
          repository: ghcr.io/home-operations/home-assistant
          tag: 2026.7.4
        resources:
          requests:
            cpu: 10m
            memory: 250Mi
          limits:
            memory: 1Gi
        securityContext:
          runAsUser: 1001
          runAsGroup: 1001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
              - ALL
service:
  app:
    controller: home-assistant
    ports:
      http:
        port: 8123

route:
  app:
    annotations:
      gethomepage.dev/enabled: "true"
      gethomepage.dev/name: "Home Assistant"
      gethomepage.dev/icon: "home-assistant"
      gethomepage.dev/description: Manage your home automations and devices
      gethomepage.dev/group: "Home Automation"
    parentRefs:
      - name: internal
        namespace: kube-system
        sectionName: https
    hostnames:
      - "hass.otohgunga.nl"
    rules:
      - backendRefs:
          - identifier: app
            port: 8123

persistence:
  config:
    enabled: true
    existingClaim: local-hass-pvc
    globalMounts:
      - path: /config

  tmpfs:
    type: emptyDir
    advancedMounts:
      home-assistant:
        app:
          - path: /tmp
            subPath: hass-tmp
