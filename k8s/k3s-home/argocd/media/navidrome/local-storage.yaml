---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: local-navidrome-pv
  labels:
    app.kubernetes.io/name: navidrome
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  storageClassName: local-navidrome
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  local:
    path: "/data/navidrome"
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-home
                - b660-i5-13600
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: local-navidrome-pvc
  namespace: navidrome
  labels:
    app.kubernetes.io/name: navidrome
spec:
  storageClassName: local-navidrome
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi