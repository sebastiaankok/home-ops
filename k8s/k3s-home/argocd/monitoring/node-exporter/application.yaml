---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  destination:
    name: in-cluster
    namespace: monitoring
  sources:
    - repoURL: https://github.com/sebastiaankok/k8s-homelab.git
      targetRevision: main
      ref: values
      path: k8s/k3s-home/argocd/monitoring/node-exporter/
      directory:
        exclude: "{application.yaml,values.yaml}"
    - chart: prometheus-node-exporter
      repoURL: https://prometheus-community.github.io/helm-charts
      targetRevision: 4.56.1
      helm:
        releaseName: node-exporter
        valueFiles:
          - "$values/k8s/k3s-home/argocd/monitoring/node-exporter/values.yaml"