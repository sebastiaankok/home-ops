---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  syncPolicy:
    automated:
      prune: true
    syncOptions:
      - CreateNamespace=true
  destination:
    name: in-cluster
    namespace: monitoring
  sources:
    - repoURL: https://github.com/sebastiaankok/k8s-homelab.git
      targetRevision: main
      ref: values
      path: k8s/k3s-home/argocd/monitoring/alloy/
      directory:
        exclude: "{application.yaml,values.yaml}"
    - chart: alloy
      repoURL: https://grafana.github.io/helm-charts
      targetRevision: 1.12.1
      helm:
        releaseName: alloy
        valueFiles:
          - "$values/k8s/k3s-home/argocd/monitoring/alloy/values.yaml"